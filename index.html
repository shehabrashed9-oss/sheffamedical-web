<script>
const TARGET=Date.parse('2026-12-11T08:00:00+03:00');   // 25 days from 16 Nov 2026, 08:00 Yanbu
const q=new URLSearchParams(location.search), RENDER=q.has('render');
const mobile=q.get('mode')?q.get('mode')==='mobile':(innerWidth/innerHeight<0.8);
const comp=document.getElementById('comp');
comp.src=(mobile?'mobile.html':'desktop.html')+(RENDER?'?render':'');
const $=id=>document.getElementById(id);
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
function spring(t,f=1.1,z=.62){if(t<=0)return 0;const w=2*Math.PI*f,wd=w*Math.sqrt(1-z*z);return 1-Math.exp(-z*w*t)*(Math.cos(wd*t)+z*w/wd*Math.sin(wd*t));}
const pad=n=>String(n).padStart(2,'0');
function digits(el,str){if(el.dataset.v===str)return;el.dataset.v=str;el.innerHTML=[...str].map(c=>`<span>${c}</span>`).join('');}
// t = seconds since page start, now = wall clock ms
window.overlay=function(t,now){
  const left=Math.max(0,TARGET-now), s=Math.floor(left/1000);
  digits($('dd'),pad(Math.floor(s/86400)));digits($('hh'),pad(Math.floor(s%86400/3600)));
  digits($('mm'),pad(Math.floor(s%3600/60)));digits($('ss'),pad(s%60));
  // pane lowers onto the design
  const d=spring(t-0.5);
  const y=(1-d)*-105;
  $('pane').style.transform=`translateY(${y}%)`;
  // pulse dot
  [['r1',0],['r2',0.8]].forEach(([id,o])=>{const ph=((t+o)%1.6)/1.6;const e=$(id);e.style.transform=`scale(${1+ph*2.6})`;e.style.opacity=(1-ph)*0.9;});
  const b=1+0.12*Math.max(0,Math.sin(t*Math.PI/0.8));document.querySelector('.dot').style.transform=`scale(${b})`;
  // moving highlight edge + sheen
  const a=t*24+30;
  if(0)$('pedge').style.background=`conic-gradient(from ${a}deg at 50% 50%,rgba(255,255,255,.18) 0deg,rgba(255,255,255,.95) 28deg,rgba(255,255,255,.18) 70deg,rgba(255,255,255,.12) 180deg,rgba(200,255,150,.8) 212deg,rgba(255,255,255,.15) 255deg,rgba(255,255,255,.18) 360deg)`;
  $('sheen').style.transform=`translateX(${((t/9)%1)*160-80}%)`;
};
window.ready=Promise.all([document.fonts.ready,new Promise(r=>comp.addEventListener('load',()=>{(comp.contentWindow.ready||Promise.resolve()).then(r)}))]);
window.seekAll=function(t,now){comp.contentWindow.seek&&comp.contentWindow.seek(t);overlay(t,now);};
if(!RENDER){const t0=performance.now();(function f(){overlay((performance.now()-t0)/1000,Date.now());requestAnimationFrame(f);})();}
document.querySelectorAll('.soc a').forEach(a=>a.addEventListener('click',()=>{const c=a.dataset.ch;(window.dataLayer=window.dataLayer||[]).push({event:(c==='whatsapp'||c==='phone')?'contact_click':'social_click',channel:c,link_url:a.href});}));
</script>
